<!doctype html>
<html lang="en" data-theme="dark" data-font="md" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NICE CXone Lab</title>
  <meta name="description" content="Free study floor for NiCE CXone: ACD, Studio, skills and routing, IVR, digital channels, WEM, Enlighten, APIs, CRM, telephony, and migration from Cisco UCCE and Avaya.">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%233ecbff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23ffb020' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23b09cff'/%3E%3C/svg%3E">
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem("cxone-lab-settings") || "{}");
      var root = document.documentElement;
      if (saved.theme) root.dataset.theme = saved.theme;
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) root.dataset.theme = "light";
      if (saved.font) root.dataset.font = saved.font;
      if (saved.motion === "reduce") root.dataset.motion = "reduce";
      else if (!saved.motion && window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) root.dataset.motion = "reduce";
    } catch (error) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="rail" aria-label="Primary">
      <a class="brand" href="#/">
        <span class="mark" aria-hidden="true"></span>
        <span><b>Signal Floor</b><span>NICE CXone Lab</span></span>
      </a>
      <nav id="rail-nav"></nav>
      <p class="rail-foot" id="rail-count">Independent study lab. Not affiliated with NiCE.</p>
    </aside>
    <div>
      <header class="top">
        <form class="search" id="search-form" role="search">
          <label class="sr" for="q">Search lessons</label>
          <input id="q" name="q" type="search" placeholder="Search skills, Studio, Autopilot, UCCE…" autocomplete="off">
          <button class="solid" type="submit">Search</button>
        </form>
        <span class="chip" id="net-chip">Online</span>
        <button class="icon-btn" type="button" id="open-settings">Settings</button>
      </header>
      <main id="main" tabindex="-1">
        <h1>NICE CXone Lab</h1>
        <p>Loading the floor…</p>
      </main>
    </div>
  </div>
  <nav class="bottom" aria-label="Mobile">
    <a href="#/" data-nav="home">Floor</a>
    <a href="#/tracks" data-nav="tracks">Tracks</a>
    <a href="#/studio" data-nav="studio">Studio</a>
    <a href="#/routing" data-nav="routing">Route</a>
    <button type="button" id="more-btn">More</button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <form id="settings-form" class="form-grid">
      <label>Theme
        <select name="theme">
          <option value="dark">Signal (dark)</option>
          <option value="light">Daylight</option>
          <option value="contrast">High contrast</option>
          <option value="dusk">Dusk</option>
        </select>
      </label>
      <label>Font size
        <select name="font">
          <option value="sm">Small</option>
          <option value="md">Medium</option>
          <option value="lg">Large</option>
          <option value="xl">Extra large</option>
        </select>
      </label>
      <label>Sound effects
        <select name="sound">
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
      </label>
      <label>Narration
        <select name="narration">
          <option value="off">Off</option>
          <option value="on">On</option>
        </select>
      </label>
      <label>Voice
        <select name="voice" id="voice-select"><option value="">Choose a voice</option></select>
      </label>
      <p class="muted" id="voice-note"></p>
      <label>Narration speed
        <select name="rate">
          <option value="0.85">0.85×</option>
          <option value="1">1×</option>
          <option value="1.15">1.15×</option>
          <option value="1.3">1.3×</option>
        </select>
      </label>
      <label>Motion
        <select name="motion">
          <option value="full">Full</option>
          <option value="reduce">Reduced</option>
        </select>
      </label>
      <div class="row">
        <button class="solid" type="submit">Save</button>
        <button class="ghost" type="button" id="close-settings">Close</button>
        <button class="ghost" type="button" id="cache-all">Save tracks for offline</button>
      </div>
      <p class="status" id="settings-status" role="status"></p>
    </form>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
